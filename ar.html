<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hilde's Space Mission - AR Rocket</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0a0a1a 0%, #1e1e3f 50%, #0a0a1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: white;
    }

    /* Star background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20px 30px, white, transparent),
        radial-gradient(2px 2px at 40px 70px, white, transparent),
        radial-gradient(1px 1px at 90px 40px, white, transparent),
        radial-gradient(2px 2px at 130px 80px, white, transparent),
        radial-gradient(1px 1px at 160px 120px, white, transparent),
        radial-gradient(2px 2px at 200px 50px, white, transparent),
        radial-gradient(1px 1px at 250px 160px, white, transparent),
        radial-gradient(2px 2px at 280px 30px, white, transparent),
        radial-gradient(1px 1px at 320px 100px, white, transparent),
        radial-gradient(2px 2px at 350px 180px, white, transparent);
      background-size: 400px 200px;
      animation: twinkle 4s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: clamp(1.5rem, 6vw, 2.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700 0%, #ff6b9d 50%, #74b9ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #b8c5d6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .emoji {
      font-size: 1.5em;
    }

    .viewer-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 30px rgba(255, 107, 157, 0.3),
        0 0 60px rgba(116, 185, 255, 0.2);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e1e3f 0%, #0a0a1a 100%);
      --poster-color: transparent;
    }

    model-viewer::part(default-ar-button) {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8c42 100%);
      border-radius: 12px;
      padding: 12px 24px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
    }

    .instructions {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      text-align: center;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      max-width: 400px;
    }

    .instructions p {
      font-size: clamp(0.9rem, 3vw, 1rem);
      color: #b8c5d6;
      line-height: 1.5;
    }

    .instructions strong {
      color: #ffd700;
    }

    .fallback-message {
      display: none;
      position: relative;
      z-index: 1;
      margin-top: 20px;
      padding: 15px 20px;
      background: rgba(255, 107, 157, 0.2);
      border: 1px solid #ff6b9d;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
    }

    /* Show fallback if AR not supported */
    @supports not ((-webkit-touch-callout: none)) {
      .fallback-message.show-on-desktop {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Hilde's Space Mission</h1>
    <p class="subtitle">
      <span class="emoji">🚀</span>
      Tap to launch the rocket!
      <span class="emoji">🚀</span>
    </p>
  </div>

  <div class="viewer-container">
    <model-viewer
      src="assets/rocket-model.glb"
      alt="A 3D cartoon rocket for Hilde's birthday party"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      rotation-per-second="30deg"
      shadow-intensity="1"
      exposure="1"
      poster=""
      loading="eager"
    >
    </model-viewer>
  </div>

  <div class="instructions">
    <p>
      <strong>On mobile:</strong> Tap the AR button to see the rocket in your room!<br>
      <strong>On desktop:</strong> Click and drag to spin the rocket around.
    </p>
  </div>

  <div class="fallback-message show-on-desktop">
    <p>For the best AR experience, scan this page's QR code with your phone!</p>
  </div>
</body>
</html>
